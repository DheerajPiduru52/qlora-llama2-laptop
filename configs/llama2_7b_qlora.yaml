# Llama-2-7B chat, QLoRA (4-bit NF4 + LoRA). Target: peak reserved VRAM <= 14 GB.
# If OOM, reduce in order: train.per_device_train_batch_size, data.max_seq_length, lora.r.
extends: base.yaml
method: qlora

quant:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  output_name: llama2-7b-qlora
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  effective_batch_size: 32
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  max_grad_norm: 0.3
  optim: paged_adamw_8bit
  bf16: true
  gradient_checkpointing: true
  eval_strategy: epoch
  save_steps: 50
  save_total_limit: 2
  logging_steps: 5
